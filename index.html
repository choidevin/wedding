<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ 관리</title>
<style>
  :root{
    --page-bg:#f5f6f8; --panel-bg:#ffffff; --border:#e5e7eb;
    --text:#111827; --sub:#6b7280; --accent:#2f6fed; --muted-bg:#f3f4f6;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--page-bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  }
  .wrap { max-width:820px; margin:0 auto; padding:28px 24px 120px; }

  .page-head { margin-bottom:18px; }
  .page-head h1 { margin:0 0 6px; font-size:21px; font-weight:800; }
  .page-head p  { margin:0; font-size:13.5px; color:var(--sub); }

  .hint-note {
    font-size:12.5px; color:var(--sub); background:#eef1f5; border-radius:8px;
    padding:10px 14px; margin-bottom:18px; line-height:1.6;
  }

  /* ---- FAQ 카드 (최대 7개, 인라인 수정) ---- */
  .item-list { display:flex; flex-direction:column; gap:12px; }
  .item-card {
    background:var(--panel-bg); border:1px solid var(--border); border-radius:10px;
    padding:16px 18px; transition: opacity .15s ease;
  }
  .item-card.disabled { opacity:.5; }

  .item-card__top { display:flex; align-items:center; gap:12px; margin-bottom:14px; }

  .switch { position:relative; width:40px; height:23px; flex:0 0 auto; }
  .switch input { opacity:0; width:0; height:0; }
  .switch .slider {
    position:absolute; inset:0; background:#d1d5db; border-radius:999px; cursor:pointer; transition:.15s;
  }
  .switch .slider::before {
    content:""; position:absolute; width:17px; height:17px; left:3px; top:3px;
    background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .switch input:checked + .slider { background:var(--accent); }
  .switch input:checked + .slider::before { transform:translateX(17px); }

  .item-status { font-size:12.5px; font-weight:700; flex:0 0 auto; }
  .item-status.on { color:#15803d; }
  .item-status.off { color:#9aa0a8; }

  .item-card__label {
    font-size:12.5px; font-weight:700; color:var(--sub);
    background:var(--muted-bg); padding:3px 9px; border-radius:999px; margin-left:auto;
  }

  .field-col { margin-bottom:12px; }
  .field-col:last-child { margin-bottom:0; }
  .field-col label { display:block; font-size:12px; color:var(--sub); margin-bottom:6px; }
  .field-col input[type="text"], .field-col textarea {
    width:100%; padding:10px 12px; border:1px solid #d9dce1; border-radius:6px;
    font-size:13.5px; font-family:inherit;
  }
  .field-col textarea { min-height:70px; resize:vertical; line-height:1.6; }
  .field-col input:focus, .field-col textarea:focus {
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(47,111,237,.12);
  }
  .field-hint { font-size:11px; color:var(--sub); margin-top:4px; }
  .char-count { font-size:11px; color:var(--sub); margin-top:4px; text-align:right; }
  .char-count.over { color:#dc2626; font-weight:700; }

  .color-field-row { display:flex; gap:16px; flex-wrap:wrap; }
  .color-field { flex:1 1 160px; }
  .color-field__label { display:block; font-size:12px; color:var(--sub); margin-bottom:6px; }
  .color-row { display:flex; align-items:center; gap:8px; }
  .color-row input[type="color"] {
    width:36px; height:36px; flex:0 0 auto; padding:0; border:1px solid #d9dce1;
    border-radius:6px; cursor:pointer; background:none;
  }
  .color-row input[type="text"] {
    flex:1; padding:8px 10px; border:1px solid #d9dce1; border-radius:6px;
    font-family:"SFMono-Regular",Consolas,monospace; font-size:12.5px;
  }

  /* ---- 하단 저장 바 ---- */
  .save-bar {
    position:sticky; bottom:20px; margin-top:20px;
    background:#eaf1ff; border:1px solid #cddcfb; border-radius:10px;
    padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .saved-toast { font-size:13px; color:#15803d; opacity:0; transition:opacity .2s ease; margin-right:auto; }
  .saved-toast.show { opacity:1; }
  .btn-save {
    padding:11px 26px; border:0; border-radius:8px; background:var(--accent); color:#fff;
    font-size:14px; font-weight:700; cursor:pointer;
  }
  .btn-save:hover { background:#1d55d1; }
  .save-bar .note { font-size:13px; color:#1f4fb0; }
</style>
</head>
<body>

<div class="wrap">

  <div class="page-head">
    <h1>FAQ 관리</h1>
    <p>홈페이지에 노출되는 자주 묻는 질문을 최대 7개까지 직접 입력하고 관리할 수 있습니다.</p>
  </div>

  <div class="hint-note">항목은 최대 <b>7개</b>까지이며, 사용하지 않는 항목은 노출 스위치를 꺼두면 됩니다. 순서는 아래 목록 순서 그대로 프론트에 노출됩니다.</div>

  <div class="item-card" style="margin-bottom:16px;">
    <div class="field-col">
      <label>FAQ 영역 바로가기 링크 (선택, 전체 1개)</label>
      <input type="text" id="sectionLinkInput" placeholder="https:// (없으면 비워두세요)" value="https://ezcampus.co.kr/faq">
      <div class="field-hint">개별 질문이 아닌 FAQ 영역 전체에 대해 하나의 링크만 사용됩니다. 마지막 질문・답변 아래에 라운드 버튼으로 노출됩니다.</div>
    </div>
    <div class="field-col" style="margin-top:16px; max-width:220px;">
      <label>버튼 문구 (최대 6자)</label>
      <input type="text" id="btnTextInput" maxlength="6" value="더보기">
      <div class="char-count" id="btnTextCount">3/6</div>
    </div>
    <div class="field-col" style="margin-top:16px;">
      <label>버튼 스타일</label>
      <div class="color-field-row">
        <div class="color-field">
          <span class="color-field__label">글자색</span>
          <div class="color-row">
            <input type="color" id="btnTextColor" value="#2f6fed">
            <input type="text" id="btnTextColorHex" value="#2F6FED">
          </div>
        </div>
        <div class="color-field">
          <span class="color-field__label">버튼 배경색</span>
          <div class="color-row">
            <input type="color" id="btnBgColor" value="#ffffff">
            <input type="text" id="btnBgColorHex" value="#FFFFFF">
          </div>
        </div>
        <div class="color-field">
          <span class="color-field__label">버튼 테두리색</span>
          <div class="color-row">
            <input type="color" id="btnBorderColor" value="#2f6fed">
            <input type="text" id="btnBorderColorHex" value="#2F6FED">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="item-list" id="itemList"></div>

  <div class="save-bar">
    <span class="saved-toast" id="savedToast">저장되었습니다.</span>
    <span class="note">변경 사항은 저장 버튼을 눌러야 반영됩니다.</span>
    <button type="button" class="btn-save" id="saveBtn">저장하기</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// ---- 고정 7개 슬롯 (데모용 초기 데이터, 5개만 채워둠) ----
let items = [
  { id:1, question:'수강 신청은 어떻게 하나요?', answer:'로그인 후 [강의실] 메뉴에서 원하는 과정을 선택하고 [신청하기] 버튼을 누르면 바로 수강 신청이 완료됩니다.', visible:true },
  { id:2, question:'수료증은 어디서 발급받나요?', answer:'진도율 100% 달성 시 [마이페이지 > 수료증 발급] 메뉴에서 즉시 출력 및 저장이 가능합니다.', visible:true },
  { id:3, question:'결제 후 환불이 가능한가요?', answer:'수강 시작 전, 또는 진도율 10% 미만인 경우 전액 환불이 가능합니다. 자세한 기준은 이용약관을 참고해 주세요.', visible:true },
  { id:4, question:'모바일에서도 수강할 수 있나요?', answer:'네, PC와 모바일 모두에서 동일한 계정으로 수강이 가능하며 진도율도 자동 동기화됩니다.', visible:true },
  { id:5, question:'아이디/비밀번호를 잊어버렸어요.', answer:'로그인 화면의 [아이디/비밀번호 찾기]에서 본인 인증 후 재설정할 수 있습니다.', visible:true },
  { id:6, question:'', answer:'', visible:false },
  { id:7, question:'', answer:'', visible:false }
];

function findItem(id) { return items.find(it => it.id === id); }
function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---- 더 많은 질문 보기 버튼 색상 동기화 ----
function syncColorPair(picker, hexInput) {
  picker.addEventListener('input', () => { hexInput.value = picker.value.toUpperCase(); });
  hexInput.addEventListener('input', () => {
    let v = hexInput.value.trim();
    if (/^#[0-9A-Fa-f]{6}$/.test(v)) picker.value = v;
  });
}
syncColorPair($('btnTextColor'), $('btnTextColorHex'));
syncColorPair($('btnBgColor'), $('btnBgColorHex'));
syncColorPair($('btnBorderColor'), $('btnBorderColorHex'));

// ---- 버튼 문구 글자수 카운트 (최대 6자 = 7자 미만) ----
function updateBtnTextCount() {
  const len = $('btnTextInput').value.length;
  const el = $('btnTextCount');
  el.textContent = `${len}/6`;
  el.classList.toggle('over', len > 6);
}
$('btnTextInput').addEventListener('input', updateBtnTextCount);
updateBtnTextCount();

function renderList() {
  const list = $('itemList');
  list.innerHTML = '';

  items.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'item-card' + (item.visible ? '' : ' disabled');
    card.innerHTML = `
      <div class="item-card__top">
        <label class="switch">
          <input type="checkbox" class="visible-toggle" data-id="${item.id}" ${item.visible ? 'checked' : ''}>
          <span class="slider"></span>
        </label>
        <span class="item-status ${item.visible ? 'on' : 'off'}">${item.visible ? '노출' : '미노출'}</span>
        <span class="item-card__label">FAQ ${i + 1}</span>
      </div>

      <div class="field-col">
        <label>질문 (Q)</label>
        <input type="text" class="question-input" data-id="${item.id}" placeholder="질문을 입력하세요" value="${escapeHtml(item.question)}">
      </div>
      <div class="field-col">
        <label>답변 (A)</label>
        <textarea class="answer-input" data-id="${item.id}" placeholder="답변을 입력하세요">${escapeHtml(item.answer)}</textarea>
      </div>
    `;
    list.appendChild(card);
  });

  bindEvents();
}

function bindEvents() {
  document.querySelectorAll('.visible-toggle').forEach(el => {
    el.addEventListener('change', () => {
      findItem(Number(el.dataset.id)).visible = el.checked;
      renderList();
    });
  });
  document.querySelectorAll('.question-input').forEach(el => {
    el.addEventListener('input', () => { findItem(Number(el.dataset.id)).question = el.value; });
  });
  document.querySelectorAll('.answer-input').forEach(el => {
    el.addEventListener('input', () => { findItem(Number(el.dataset.id)).answer = el.value; });
  });
}

$('saveBtn').addEventListener('click', () => {
  const invalid = items.find(it => it.visible && (!it.question.trim() || !it.answer.trim()));
  if (invalid) { alert('노출 처리된 항목은 질문과 답변을 모두 입력해 주세요.'); return; }
  if ($('btnTextInput').value.trim().length === 0) { alert('버튼 문구를 입력해 주세요.'); return; }
  if ($('btnTextInput').value.length > 6) { alert('버튼 문구는 6자(7자 미만) 이내로 입력해 주세요.'); return; }

  // TODO: 실제 연동 시 이 시점에 items 배열 + 버튼 문구/링크/색상 값을 서버로 저장하세요.
  const toast = $('savedToast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1500);
});

renderList();
</script>
</body>
</html>
